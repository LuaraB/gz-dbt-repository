 # schema.yml

 version: 2

 sources:
   - name: gz_raw_data
     schema: gz_raw_data #Path of the table in BQ
     description: greenwez raw data source #optionnal
     tables:
       - name: sales #Renaming as an alias
         identifier: raw_gz_sales #What is the exact name of the table in  BQ
         description: sales of greewneez / we have one row per product_id found in each order_id
         # Freshness testing - make sure to fill in the ...
         loaded_at_field: "CAST(... AS TIMESTAMP)"
         freshness:
          warn_after: {count: 90, period: day}      
         columns:
             - name: "(orders_id || '-' || pdt_id)"
               description: primary key of the table
               tests:
                 - unique
                 - not_null
             - name: date_date
               description: date of purchase
             - name: orders_id
               description: order number
             - name: products_id
               description: product number   
             - name: revenue
               description: revenue from the purchase
             - name: quantity
               description: quantity sold            
       - name: product
         identifier: raw_gz_product
         description: purchase_price by products_id
         columns:
             - name: products_id
               description: primary key of the table
               tests:
                 - unique
                 - not_null
         
       - name: ship
         identifier: raw_gz_ship
         description: shipcost
         columns:
           - name: orders_id
             description: primary key
             tests:
               - unique
               - not_null
       - name: adwords
         identifier: raw_gz_adwords
         columns: 
            - name: "(date_date || '-' || campaign_key)"
              description: primary key
              tests:
                - unique
                - not_null
       - name: bing
         identifier: raw_gz_bing
         columns: 
            - name: "(date_date || '-' || campaign_key)"
              description: primary key
              tests:
                - unique
                - not_null  
       - name: criteo
         identifier: raw_gz_criteo
         columns: 
            - name: "(date_date || '-' || campaign_key)"
              description: primary key
              tests:
                - unique
                - not_null   
       - name: facebook
         identifier: raw_gz_facebook
         columns: 
            - name: "(date_date || '-' || campaign_key)"
              description: primary key
              tests:
                - unique
                - not_null                                           
 models:
        - name: int_sales_margin #dbt path
          description:  margin per product calculation #calculation
          columns:
            - name: "(orders_id || '-' || products_id)"
              description: primary key of the table
              tests:
                - unique
                - not_null
            - name: products_id
              tests:
                - not_null
            - name: date_date
              tests:
                - not_null
            - name: orders_id
              tests:
                - not_null
            - name: revenue
              tests:
                - not_null
            - name: quantity
              tests:
                - not_null
            - name: purchase_price
              tests:
                - not_null
            - name: margin
              tests:
                - not_null
            - name: purchase_cost
              tests:
                - not_null
        - name: int_orders_margin
          description: Calculate the Margin per Order
          columns:
           - name: orders_id
             description: primary key
             tests:
               - unique
               - not_null
           - name: date_date
             tests:
             - not_null
           - name: revenue
             tests:
               - not_null
           - name: quantity
             tests:
               - not_null
           - name: purchase_cost
             tests: 
               - not_null
           - name: margin
             tests:
               - not_null     
        - name: int_orders_operational
          description: "Order-level model including revenue, margin, shipping costs, and operational margin."
          columns:
            - name: orders_id
              description: "Primary key."
              tests:
                - not_null
                #- unique
            - name: date_date
              description: "Date of the order."
              tests:
                - not_null
            - name: revenue
              description: "Total revenue per order."
              tests:
              - not_null
            - name: purchase_cost
              description: "Total purchase cost per order."
              tests:
              - not_null        
            - name: margin
              description: "Margin per order (revenue - purchase_cost)."
              tests:
              - not_null        
            - name: shipping_fee
              description: "Shipping fee paid by the customer."
              tests:
              - not_null             
            - name: ship_cost
              description: "Shipping cost incurred by the company."
              tests:
              - not_null        
            - name: operational_margin
              description: "Operational margin per order: margin + shipping_fee - log_cost - ship_cost."
              tests:
                - not_null
        - name: finance_day
          description: daily financial metrics
          columns:
            - name: date_date
              description: primary key of the table
              tests:
                - unique
                - not_null
            - name: total_number_of_transactions
              tests:
                - not_null
            - name: total_revenue
              tests:
                - not_null
            - name: average_basket
              tests:
                - not_null
            - name: operational_margin
              tests:
                - not_null
            - name: total_purchase_cost
              tests:
                - not_null
            - name: total_shipping_fee
              tests:
                - not_null    
            - name: total_logcost
              tests:
                - not_null
            - name: total_quantity
              tests:
                - not_null
        - name: int_campaigns
          description: merged all campaigns
          columns:
            - name: "(date_date || '-' || campaign_key)"
              description: primary key of the table
              tests:
                - unique
                - not_null     
            - name: date_date
              tests:
                - not_null
            - name: campaign_key
              tests:
                - not_null
            - name: campaign_name
              tests:
                - not_null
            - name: ads_cost
              tests:
                - not_null
            - name: impression
              tests:
                - not_null
            - name: click
              tests:
                - not_null
        - name: int_campaigns_day
          description: daily ads metrics
          columns:
          - name: date_date
            description: primary key of the table
            tests:
              - unique
              - not_null   
          - name: ads_cost_day
            tests:
              - not_null
          - name: imp_day
            tests:
              - not_null
          - name: click_day
            tests:
              - not_null
        - name: finance_campaigns_day
          description: daily finance campaigns
          columns:
          - name: date_date
            description: primary key of the table
            tests:
              - unique
              - not_null    
          - name: operational_margin
            tests:
              - not_null
          - name: total_quantity
            tests:
              - not_null
          - name: total_revenue
            tests:
              - not_null
          - name: total_purchase_cost
            tests:
              - not_null
          - name: margin
            tests:
              - not_null
          - name: total_shipping_fee
            tests:
              - not_null
          - name: total_logcost
            tests:
              - not_null
          - name: total_ship_cost
            tests:
              - not_null  
